<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="store-ops-approval-prefix" content="%%STORE_OPS_APPROVAL_PREFIX%%" />
    <title>Demo Store dashboard</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--color-background-primary, #ffffff);
        --bg-soft: var(--color-background-secondary, #f4f4f5);
        --text: var(--color-text-primary, #18181b);
        --muted: var(--color-text-secondary, #5b5b66);
        --line: var(--color-border-primary, #dcdce0);
        --accent: var(--color-text-info, #1d5fd1);
        --warn: var(--color-text-warning, #9a5b00);
        --danger: var(--color-text-danger, #b42318);
        --radius: var(--border-radius-md, 8px);
        --font: var(--font-sans, system-ui, -apple-system, 'Segoe UI', sans-serif);
      }
      :root[data-theme='dark'] {
        --bg: var(--color-background-primary, #18181b);
        --bg-soft: var(--color-background-secondary, #26262b);
        --text: var(--color-text-primary, #f4f4f5);
        --muted: var(--color-text-secondary, #a8a8b3);
        --line: var(--color-border-primary, #3a3a42);
        --accent: var(--color-text-info, #7fb0ff);
        --warn: var(--color-text-warning, #f0b45a);
        --danger: var(--color-text-danger, #ff8a80);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: var(--color-background-primary, #18181b);
          --bg-soft: var(--color-background-secondary, #26262b);
          --text: var(--color-text-primary, #f4f4f5);
          --muted: var(--color-text-secondary, #a8a8b3);
          --line: var(--color-border-primary, #3a3a42);
          --accent: var(--color-text-info, #7fb0ff);
          --warn: var(--color-text-warning, #f0b45a);
          --danger: var(--color-text-danger, #ff8a80);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 12px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 var(--font);
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 16px;
        margin: 0;
      }
      h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 16px 0 6px;
      }
      .badge {
        display: inline-block;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 8px;
        font-size: 12px;
        color: var(--muted);
        margin-left: 6px;
        vertical-align: middle;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      button {
        font: inherit;
        color: var(--text);
        background: var(--bg-soft);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 4px 10px;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        border-color: var(--accent);
        color: var(--accent);
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 8px;
      }
      .card {
        background: var(--bg-soft);
        border-radius: var(--radius);
        padding: 8px 10px;
      }
      .card .label {
        font-size: 12px;
        color: var(--muted);
      }
      .card .value {
        font-size: 18px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 5px 6px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        overflow-wrap: anywhere;
      }
      th {
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
      }
      td.num,
      th.num {
        text-align: right;
        white-space: nowrap;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li {
        padding: 6px 0;
        border-bottom: 1px solid var(--line);
        overflow-wrap: anywhere;
      }
      .muted {
        color: var(--muted);
      }
      .warn {
        color: var(--warn);
      }
      .danger {
        color: var(--danger);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        background: var(--bg-soft);
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 12px;
      }
      .approval .actions {
        margin-top: 4px;
      }
      .url {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      #status {
        min-height: 1.2em;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1><span id="store-name">Store dashboard</span><span class="badge">Demo Store</span></h1>
      <div class="controls" id="controls"></div>
    </header>
    <div id="status" class="muted" role="status" aria-live="polite">Loading the dashboard...</div>
    <main id="dashboard"></main>
    <script>
      /*DASHBOARD_SCRIPT*/
    </script>
  </body>
</html>
